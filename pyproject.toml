# COMP101 Ontology Review
#
# Shared team toolkit: drop an OWL/TTL file → KPIs + structural/OOPS/HermiT/CQ
# analysis + vocab diff vs the shared COMP101 T-Box.
# Merge into Gnosis (JSON/Neo4j) is intentionally out of scope for this repo.

[project]
name = "comp101-ontology-review"
version = "0.1.0"
description = "Drop OWL, get ontology KPIs and review reports for COMP101 modules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rdflib>=7.0",
  "owlready2>=0.46",
  "requests>=2.31",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[project.scripts]
ontology-review = "ontology_review.__main__:main"
ontology-review-ui = "ontology_review.web.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ontology_review*"]

[tool.setuptools.package-data]
ontology_review = ["configs/*.json", "baselines/*.json", "web/static/*"]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COMP101 Ontology Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #14201a;
      --muted: #4a5c52;
      --line: #c5d0c8;
      --paper: #f3f6f2;
      --panel: #ffffff;
      --accent: #1f6b4a;
      --accent-soft: #d8ebe0;
      --bad: #a11f2c;
      --drop: #e8efea;
      --drop-active: #d0e5d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #dce9e1 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #e4ebe6 0%, transparent 45%),
        var(--paper);
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    header h1 {
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    header p {
      margin: 0;
      color: var(--muted);
      max-width: 36rem;
      line-height: 1.45;
    }
    .modes { display: flex; gap: 0.5rem; margin: 1.75rem 0 1.25rem; }
    .modes button {
      font: inherit;
      font-weight: 500;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      padding: 0.55rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .modes button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.25rem;
    }
    .drops { display: grid; gap: 1rem; }
    .drops.compare { grid-template-columns: 1fr 1fr; }
    @media (max-width: 700px) {
      .drops.compare { grid-template-columns: 1fr; }
    }
    .drop {
      border: 2px dashed var(--line);
      background: var(--drop);
      border-radius: 10px;
      min-height: 150px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 0.35rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .drop.over { background: var(--drop-active); border-color: var(--accent); }
    .drop.has-file {
      border-style: solid;
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .drop .label { font-weight: 600; font-size: 0.95rem; }
    .drop .hint { color: var(--muted); font-size: 0.85rem; }
    .drop .fname {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.82rem;
      margin-top: 0.4rem;
      word-break: break-all;
    }
    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      margin: 1.1rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .opts label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
    .opts select {
      font: inherit;
      margin-left: 0.35rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.25rem 0.45rem;
      background: var(--panel);
      color: var(--ink);
      max-width: 16rem;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.15rem;
    }
    .actions .go {
      font: inherit;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.65rem 1.25rem;
      cursor: pointer;
    }
    .actions .go:disabled { opacity: 0.45; cursor: not-allowed; }
    .status { font-size: 0.9rem; color: var(--muted); }
    .status.err { color: var(--bad); }
    .result {
      margin-top: 1.75rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel);
      min-height: 200px;
      display: none;
    }
    .result.visible { display: block; }
    .result iframe {
      width: 100%;
      min-height: 70vh;
      border: 0;
      background: #fff;
    }
    .paths {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 0.6rem 1rem;
      border-top: 1px solid var(--line);
      background: var(--paper);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>COMP101 Ontology Review</h1>
      <p>Drop an OWL module for full review, or drop two to compare vocabularies side by side. Reports stay on this machine.</p>
    </header>

    <div class="modes" role="tablist">
      <button type="button" id="mode-validate" aria-pressed="true">Validate one</button>
      <button type="button" id="mode-compare" aria-pressed="false">Compare two</button>
    </div>

    <div class="panel">
      <div id="drops" class="drops">
        <div class="drop" id="drop-a" tabindex="0" role="button" aria-label="Drop ontology A">
          <span class="label" id="label-a">Ontology</span>
          <span class="hint">Drag &amp; drop .owl / .ttl, or click to browse</span>
          <span class="fname" id="fname-a"></span>
          <input type="file" id="file-a" accept=".owl,.ttl,.rdf,.n3,.nt,.jsonld" hidden />
        </div>
        <div class="drop" id="drop-b" tabindex="0" role="button" aria-label="Drop ontology B" hidden>
          <span class="label">Ontology B</span>
          <span class="hint">Drag &amp; drop .owl / .ttl, or click to browse</span>
          <span class="fname" id="fname-b"></span>
          <input type="file" id="file-b" accept=".owl,.ttl,.rdf,.n3,.nt,.jsonld" hidden />
        </div>
      </div>

      <div class="opts">
        <label>
          CQ pack
          <select id="opt-config">
            <option value="auto">Auto (namespace → else generic shape)</option>
            <option value="comp101_generic">Generic shape (any module)</option>
            <option value="comp101_w5_w6">W5–W6 lists/dicts/sets CQs</option>
            <option value="comp101_oop">OOP module CQs only</option>
            <option value="comp101_ics">ICS module CQs only</option>
          </select>
        </label>
        <label><input type="checkbox" id="opt-reasoner" /> Run HermiT (needs JVM)</label>
        <label><input type="checkbox" id="opt-oops" /> Run OOPS! (needs network)</label>
      </div>

      <div class="actions">
        <button type="button" class="go" id="run" disabled>Validate</button>
        <span class="status" id="status"></span>
      </div>
    </div>

    <div class="result" id="result">
      <iframe id="frame" title="Validation report"></iframe>
      <div class="paths" id="paths"></div>
    </div>
  </div>

  <script>
    (function () {
      const state = { mode: "validate", fileA: null, fileB: null };

      const modeValidate = document.getElementById("mode-validate");
      const modeCompare = document.getElementById("mode-compare");
      const drops = document.getElementById("drops");
      const dropA = document.getElementById("drop-a");
      const dropB = document.getElementById("drop-b");
      const fileA = document.getElementById("file-a");
      const fileB = document.getElementById("file-b");
      const fnameA = document.getElementById("fname-a");
      const fnameB = document.getElementById("fname-b");
      const labelA = document.getElementById("label-a");
      const runBtn = document.getElementById("run");
      const statusEl = document.getElementById("status");
      const result = document.getElementById("result");
      const frame = document.getElementById("frame");
      const paths = document.getElementById("paths");
      const optReasoner = document.getElementById("opt-reasoner");
      const optOops = document.getElementById("opt-oops");
      const optConfig = document.getElementById("opt-config");

      function refreshReady() {
        const ok = state.mode === "validate"
          ? !!state.fileA
          : !!(state.fileA && state.fileB);
        runBtn.disabled = !ok;
      }

      function setMode(mode) {
        state.mode = mode;
        modeValidate.setAttribute("aria-pressed", String(mode === "validate"));
        modeCompare.setAttribute("aria-pressed", String(mode === "compare"));
        dropB.hidden = mode !== "compare";
        drops.classList.toggle("compare", mode === "compare");
        labelA.textContent = mode === "compare" ? "Ontology A" : "Ontology";
        runBtn.textContent = mode === "compare" ? "Compare" : "Validate";
        refreshReady();
      }

      function wire(zone, input, key, fnameEl) {
        zone.addEventListener("click", () => input.click());
        zone.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); }
        });
        input.addEventListener("change", () => {
          const f = input.files && input.files[0];
          if (!f) return;
          state[key] = f;
          zone.classList.add("has-file");
          fnameEl.textContent = f.name + " · " + Math.round(f.size / 1024) + " KB";
          refreshReady();
        });
        ["dragenter", "dragover"].forEach((ev) => {
          zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.add("over"); });
        });
        zone.addEventListener("dragleave", (e) => { e.preventDefault(); zone.classList.remove("over"); });
        zone.addEventListener("drop", (e) => {
          e.preventDefault();
          zone.classList.remove("over");
          const f = e.dataTransfer.files && e.dataTransfer.files[0];
          if (!f) return;
          state[key] = f;
          zone.classList.add("has-file");
          fnameEl.textContent = f.name + " · " + Math.round(f.size / 1024) + " KB";
          refreshReady();
        });
      }

      modeValidate.addEventListener("click", () => setMode("validate"));
      modeCompare.addEventListener("click", () => setMode("compare"));
      wire(dropA, fileA, "fileA", fnameA);
      wire(dropB, fileB, "fileB", fnameB);

      runBtn.addEventListener("click", async () => {
        runBtn.disabled = true;
        statusEl.classList.remove("err");
        statusEl.textContent = state.mode === "compare"
          ? "Comparing… this can take a minute."
          : "Validating… this can take a minute.";
        result.classList.remove("visible");

        const fd = new FormData();
        fd.append("use_oops", optOops.checked ? "1" : "0");
        fd.append("use_reasoner", optReasoner.checked ? "1" : "0");
        fd.append("config_id", optConfig.value);

        let url;
        if (state.mode === "validate") {
          url = "/api/validate";
          fd.append("file", state.fileA);
        } else {
          url = "/api/compare";
          fd.append("file_a", state.fileA);
          fd.append("file_b", state.fileB);
        }

        try {
          const res = await fetch(url, { method: "POST", body: fd });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            throw new Error(data.error || ("HTTP " + res.status));
          }
          frame.srcdoc = data.html;
          paths.textContent = "Saved: " + data.report_html + "  ·  " + data.report_json;
          result.classList.add("visible");
          statusEl.textContent = "Done.";
        } catch (err) {
          statusEl.classList.add("err");
          statusEl.textContent = err.message || String(err);
        } finally {
          refreshReady();
        }
      });

      setMode("validate");
    })();
  </script>
</body>
</html>

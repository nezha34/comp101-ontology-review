    }
  },
  {
    "data": {
      "id": "MR_OOP02",
      "label": "Setter Method",
      "type": "MethodRole",
      "definition": "A public method that safely sets a private attribute with optional validation. Enforces class invariants on mutation.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "MR_OOP03",
      "label": "Abstract Method",
      "type": "MethodRole",
      "definition": "A method declared in a parent class with no implementation body. Forces every subclass to provide its own implementation. Defined via @abstractmethod.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "MR_OOP04",
      "label": "Class Method",
      "type": "MethodRole",
      "definition": "A method that receives the class itself (not an instance) as its first argument. Defined with @classmethod. Used for alternative constructors or class-level operations.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "MR_OOP05",
      "label": "Static Method",
      "type": "MethodRole",
      "definition": "A method with no implicit first argument \u2014 neither instance nor class. Defined with @staticmethod. Behaves like a plain function that lives in the class namespace.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "DA_OOP01",
      "label": "Abstract Class",
      "type": "DesignAbstraction",
      "definition": "A class that cannot be instantiated directly and contains at least one abstract method. Enforces a contract: all concrete subclasses must implement the abstract methods.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "DA_OOP02",
      "label": "Interface",
      "type": "DesignAbstraction",
      "definition": "A design abstraction defining a set of methods a class must implement without providing any implementation. Python achieves this via Abstract Base Classes or duck typing rather than a dedicated keyword.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "DA_OOP03",
      "label": "Composition",
      "type": "DesignAbstraction",
      "definition": "The has-a design principle: building complex objects by containing instances of other objects rather than inheriting from them. Generally preferred over deep inheritance hierarchies.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "DA_OOP04",
      "label": "Mixin",
      "type": "DesignAbstraction",
      "definition": "A class designed to add a specific behaviour to other classes via multiple inheritance, without being intended as a standalone class. Provides reusable behaviour slices.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "DA_OOP05",
      "label": "Design Pattern",
      "type": "DesignAbstraction",
      "definition": "A named, reusable solution template for a recurring software design problem. Patterns (Factory, Strategy, Observer, etc.) are language-agnostic blueprints, not code.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "DA_OOP06",
      "label": "UML Class Diagram",
      "type": "DesignAbstraction",
      "definition": "A standardised visual notation for class structure: shows classes, attributes, methods, and relationships (inheritance, composition, association) in a language-independent diagram.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "DA_OOP07",
      "label": "Global State Problem",
      "type": "DesignAbstraction",
      "definition": "The anti-pattern where data is scattered across global variables, causing naming collisions, no shared behaviour, and copy-paste for every new feature. OOP solves this by bundling data with methods in a class.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "PI_OOP01",
      "label": "Decorator",
      "type": "PythonInternals",
      "definition": "A callable that wraps a function or class, modifying its behaviour without changing its source code. Written with @ syntax. Enables aspect-oriented patterns (logging, timing, access control).",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "PI_OOP02",
      "label": "Property Object",
      "type": "PythonInternals",
      "definition": "The object created by the @property decorator. Intercepts attribute access (get, set, delete) on an instance, letting you define attribute access as method calls while keeping dot-notation syntax.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "PI_OOP03",
      "label": "Metaclass",
      "type": "PythonInternals",
      "definition": "The class of a class. In Python every class is itself an object, and its metaclass (default: type) controls how the class is created, what attributes it has, and how subclassing works.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "PI_OOP04",
      "label": "__dict__",
      "type": "PythonInternals",
      "definition": "The dictionary that stores an object's (or class's) attribute namespace. Instance __dict__ holds per-object attributes; class __dict__ holds class-level attributes and methods.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "PI_OOP05",
      "label": "__mro__",
      "type": "PythonInternals",
      "definition": "The Method Resolution Order tuple on a class. Lists the exact sequence Python searches for attributes and methods when a class uses inheritance, following the C3 linearisation algorithm.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },
  {
    "data": {
      "id": "PI_OOP06",
      "label": "__slots__",
      "type": "PythonInternals",
      "definition": "A class attribute that replaces the default __dict__ with a fixed set of allowed instance attribute names. Reduces per-instance memory overhead and prevents dynamic attribute creation.",
      "cognitive_type": "",
      "best_practice": ""
    }
  },

const hiddenTypes=new Set(),hiddenRels=new Set();
function refresh(){cy.batch(()=>{cy.nodes().forEach(n=>hiddenTypes.has(n.data('type'))?n.hide():n.show());cy.edges().forEach(e=>{const r=e.data('rel');if(hiddenRels.has(r)||cy.$('#'+e.data('source')).hidden()||cy.$('#'+e.data('target')).hidden())e.hide();else e.show();});});}
document.querySelectorAll('.cb-type').forEach(cb=>cb.addEventListener('change',()=>{cb.checked?hiddenTypes.delete(cb.dataset.type):hiddenTypes.add(cb.dataset.type);refresh();}));
document.querySelectorAll('.cb-rel').forEach(cb=>cb.addEventListener('change',()=>{cb.checked?hiddenRels.delete(cb.dataset.rel):hiddenRels.add(cb.dataset.rel);refresh();}));
function applyLayout(){const n=document.getElementById('ls').value;cy.layout(n==='dagre'?{name:n,rankDir:'TB',nodeSep:55,rankSep:75,padding:30}:{name:n,padding:40}).run();}
function clear_(){cy.elements().removeClass('highlighted faded');document.getElementById('detail').style.display='none';}
function setF(vi,wi,val){const w=document.getElementById(wi);if(val){document.getElementById(vi).textContent=val;w.style.display='block';}else w.style.display='none';}
cy.on('tap','node',e=>{const node=e.target,d=node.data();cy.elements().addClass('faded');node.closedNeighborhood().removeClass('faded').addClass('highlighted');node.addClass('highlighted');document.getElementById('d-name').textContent=d.label;setF('d-type','fw-type',d.type);setF('d-def','fw-def',d.definition);setF('d-cog','fw-cog',d.cognitive_type);setF('d-bp','fw-bp',d.best_practice);document.getElementById('detail').style.display='block';});
cy.on('tap',e=>{if(e.target===cy)clear_();});
document.getElementById('search').addEventListener('input',function(){const q=this.value.toLowerCase().trim();if(!q){clear_();return;}cy.elements().addClass('faded');cy.nodes().filter(n=>n.data('label').toLowerCase().includes(q)).removeClass('faded').addClass('highlighted').forEach(n=>n.closedNeighborhood().removeClass('faded'));});
